<!doctype html>
<html lang="pt">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <meta http-equiv="refresh" content="6;url=https://devnexusdigital.com/">
  <title>Mensagem enviada | DevNexus Digital</title>
  <style>
    :root {
      --bg:#0b0f16;
      --paper:#f4f1ea;
      --muted:rgba(244,241,234,.66);
      --line:rgba(244,241,234,.14);
      --cyan:#85efe6;
      --blue:#8fb7ff;
    }

    * { box-sizing:border-box; margin:0; padding:0; }

    body {
      min-height:100vh;
      display:grid;
      place-items:center;
      padding:28px;
      font-family:Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", Arial, sans-serif;
      color:var(--paper);
      background:
        radial-gradient(circle at 18% 8%, rgba(143,183,255,.14), transparent 28%),
        radial-gradient(circle at 82% 18%, rgba(133,239,230,.12), transparent 30%),
        linear-gradient(135deg,#090d13 0%,#0d1117 50%,#111827 100%);
    }

    .card {
      width:min(720px,100%);
      padding:clamp(32px,6vw,64px);
      border:1px solid var(--line);
      border-radius:38px;
      background:rgba(244,241,234,.055);
      box-shadow:0 42px 140px rgba(0,0,0,.38);
      text-align:center;
      backdrop-filter:blur(20px);
    }

    .check {
      width:78px;
      height:78px;
      margin:0 auto 26px;
      border-radius:50%;
      display:grid;
      place-items:center;
      color:#0d1117;
      background:linear-gradient(135deg,var(--cyan),var(--blue));
      font-size:2.4rem;
      font-weight:900;
      box-shadow:0 0 44px rgba(133,239,230,.25);
    }

    h1 {
      font-size:clamp(2.5rem,7vw,5rem);
      line-height:.95;
      letter-spacing:-.07em;
      margin-bottom:20px;
    }

    p {
      color:var(--muted);
      font-size:clamp(1rem,2.2vw,1.2rem);
      line-height:1.65;
      margin-inline:auto;
      max-width:590px;
    }

    .return {
      margin-top:20px;
      font-size:.94rem;
      color:rgba(244,241,234,.52);
    }

    .btn {
      display:inline-flex;
      align-items:center;
      justify-content:center;
      min-height:48px;
      margin-top:30px;
      padding:13px 22px;
      border-radius:999px;
      color:#0d1117;
      background:var(--paper);
      font-weight:850;
      text-decoration:none;
    }
  </style>
</head>
<body>
  <main class="card">
    <div class="check" aria-hidden="true">✓</div>
    <h1>Mensagem enviada com sucesso.</h1>
    <p>
      Agradecemos o seu contacto. A DevNexus Digital recebeu a mensagem
      e responderá através do endereço de email indicado.
    </p>
    <p class="return">Regresso automático à página inicial dentro de alguns segundos.</p>
    <a class="btn" href="https://devnexusdigital.com/">Voltar agora à página inicial</a>
  </main>

  <script>
    window.setTimeout(() => {
      window.location.replace("https://devnexusdigital.com/");
    }, 6000);
  </script>
</body>
</html>
